<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Venduto Pdv Trony Diego</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0f14; --card:#161a22; --border:#232936;
    --input:#0d0f14; --input-border:#2a3140;
    --gold:#e8b84b; --gold2:#c9971f; --gold3:#b8860b;
    --text:#eef1f6; --muted:#8a93a6; --ok:#4ade80; --err:#f87171;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}

  .back{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--card);
    color:var(--gold);font:700 16px 'DM Sans',sans-serif;text-decoration:none;cursor:pointer;margin-bottom:18px}

  header{margin-bottom:18px}
  h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .clock{margin-top:6px;font-family:'DM Mono',monospace;color:var(--gold);font-size:15px}

  .card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:18px 16px 16px;margin-bottom:16px;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;
    background:linear-gradient(90deg,var(--gold3),var(--gold),var(--gold2))}
  .card h2{margin:0 0 12px;font-size:15px;font-weight:700;color:var(--muted)}

  .row{display:grid;grid-template-columns:1fr 160px;align-items:center;gap:12px;padding:7px 0}
  .row + .row{border-top:1px solid var(--border)}
  .row label{font-weight:700;font-size:17px}
  .field{position:relative}
  .field span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:'DM Mono',monospace}
  input,textarea{width:100%;background:var(--input);border:1px solid var(--input-border);border-radius:10px;
    color:var(--text);font:500 17px 'DM Mono',monospace;padding:11px 12px 11px 28px;text-align:right;outline:none}
  textarea{font:400 15px 'DM Sans',sans-serif;text-align:left;padding:11px 12px;resize:vertical;min-height:60px}
  input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,184,75,.18)}


  .toggle{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--muted);font-size:15px;cursor:pointer}
  .toggle input{width:20px;height:20px;accent-color:var(--gold);padding:0}

  pre{margin:0;white-space:pre-wrap;word-break:break-word;font:400 14px/1.5 'DM Mono',monospace;color:var(--text)}

  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:14px;
    padding:16px;font:800 17px 'DM Sans',sans-serif;cursor:pointer;margin-bottom:10px}
  .btn-tg{background:linear-gradient(135deg,var(--gold),var(--gold2) 60%,var(--gold3));color:#14110a}
  .btn-sec{background:var(--card);border:1px solid var(--border);color:var(--text)}
  .btn:active{transform:scale(.985)}
  .btn:focus-visible,.back:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid2 .btn{margin:0}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
    background:#1f2430;border:1px solid var(--gold3);color:var(--text);padding:12px 18px;border-radius:12px;
    font-weight:700;opacity:0;pointer-events:none;transition:.25s}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
  @media (max-width:380px){.row{grid-template-columns:1fr 140px}}
</style>
</head>
<body>
<div class="wrap">

  <a class="back" id="backBtn" href="#">← Torna alla Home Hub</a>

  <header>
    <h1>Venduto Giorno in Progress</h1>
    <div class="clock" id="clock"></div>
  </header>

  <section class="card">
    <h2>Inserisci il venduto di ogni PDV</h2>
    <div id="rows"></div>
    <label class="toggle"><input type="checkbox" id="rank" checked> Ordina il messaggio dal PDV con più venduto</label>
  </section>

  <section class="card">
    <h2>Nota (facoltativa)</h2>
    <textarea id="note" placeholder="Es. ottimo pomeriggio su TV"></textarea>
  </section>

  <section class="card">
    <h2>Anteprima messaggio</h2>
    <pre id="preview"></pre>
  </section>

  <button class="btn btn-tg" id="sendTg">✈️ Apri Telegram e invia</button>
  <div class="grid2">
    <button class="btn btn-sec" id="copy">Copia messaggio</button>
    <button class="btn btn-sec" id="reset">Azzera valori</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // Link della Home Hub (lascia vuoto per tornare alla pagina precedente)
  const HUB_URL = "";

  const PDV = ["Fano","Monsano","Osimo","Macerata","Civitanova","Pesaro","Foligno"];
  const KEY = "dml_venduto_pdv_v1";
  const $ = id => document.getElementById(id);
  const eur = n => "€ " + n.toLocaleString("it-IT",{minimumFractionDigits:0,maximumFractionDigits:2});

  // Parse formato italiano: "12.340,50" / "12340" / "12340.5"
  function parse(v){
    v = String(v||"").trim().replace(/[€\s]/g,"");
    if(!v) return null;
    if(v.includes(",")) v = v.replace(/\./g,"").replace(",",".");
    else if((v.match(/\./g)||[]).length>1 || /\.\d{3}$/.test(v)) v = v.replace(/\./g,"");
    const n = parseFloat(v);
    return isNaN(n) ? null : n;
  }

  function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
  function save(d){ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} }

  const saved = load();
  $("rows").innerHTML = PDV.map(p => `
    <div class="row">
      <label for="v_${p}">${p}</label>
      <div class="field"><span>€</span>
        <input id="v_${p}" inputmode="decimal" autocomplete="off" placeholder="0" value="${saved[p]??""}">
      </div>
    </div>`).join("");
  $("note").value = saved._note || "";
  if(saved._rank === false) $("rank").checked = false;

  function nowParts(){
    const d = new Date();
    const data = d.toLocaleDateString("it-IT",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"});
    const ora = d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
    return {data, ora};
  }

  function buildMessage(){
    const {data, ora} = nowParts();
    let list = PDV.map(p => ({p, v: parse($("v_"+p).value)}));
    if($("rank").checked){
      list = list.slice().sort((a,b)=> (b.v??-1)-(a.v??-1));
    }
    const medals = ["🥇","🥈","🥉"];
    let i = 0;
    const lines = list.map(x => {
      if(x.v===null) return `▫️ ${x.p}: —`;
      const m = $("rank").checked ? (medals[i++] || "▪️") : "▪️";
      return `${m} ${x.p}: ${eur(x.v)}`;
    });
    let msg = `📊 VENDUTO PDV TRONY DIEGO\n📅 ${data.charAt(0).toUpperCase()+data.slice(1)} · 🕒 ore ${ora}\n\n${lines.join("\n")}`;
    const note = $("note").value.trim();
    if(note) msg += `\n\n📝 ${note}`;
    return {msg};
  }

  function refresh(){
    const {msg} = buildMessage();
    $("preview").textContent = msg;
    const d = {}; PDV.forEach(p => d[p] = $("v_"+p).value);
    d._note = $("note").value; d._rank = $("rank").checked;
    save(d);
  }

  function tick(){
    const {data, ora} = nowParts();
    $("clock").textContent = data.charAt(0).toUpperCase()+data.slice(1) + " · ore " + ora;
  }

  function toast(t){
    const el = $("toast"); el.textContent = t; el.classList.add("show");
    clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("show"),1800);
  }

  document.addEventListener("input", refresh);
  $("rank").addEventListener("change", refresh);

  $("sendTg").addEventListener("click", () => {
    const {msg} = buildMessage();          // data e ora prese al momento dell'invio
    $("preview").textContent = msg;
    const txt = encodeURIComponent(msg);
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    // Su telefono apre direttamente l'app Telegram con la scelta della chat
    window.location.href = isMobile ? "tg://msg?text=" + txt : "https://t.me/share/url?url=" + txt;
  });

  $("copy").addEventListener("click", async () => {
    const {msg} = buildMessage();
    try{ await navigator.clipboard.writeText(msg); toast("Messaggio copiato"); }
    catch(e){
      const ta = document.createElement("textarea"); ta.value = msg; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); ta.remove(); toast("Messaggio copiato");
    }
  });

  $("reset").addEventListener("click", () => {
    if(!confirm("Azzerare tutti i valori?")) return;
    PDV.forEach(p => $("v_"+p).value = ""); $("note").value = "";
    refresh(); toast("Valori azzerati");
  });

  $("backBtn").addEventListener("click", e => {
    e.preventDefault();
    if(HUB_URL) location.href = HUB_URL; else history.back();
  });

  tick(); setInterval(tick, 15000);
  refresh();
</script>
</body>
</html>
